<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLite | Personal Expenses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VanillaTilt.js for the 3D hover mechanism -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1E1E24',
                        accent: '#10b981', 
                        accentHover: '#059669'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        /* Smooth transition for the tilt elements */
        .tilt-card { transform-style: preserve-3d; }
        .tilt-card-inner { transform: translateZ(20px); }
    </style>
</head>
<body class="p-4 md:p-8 max-w-3xl mx-auto min-h-screen flex flex-col" onclick="initAudio()">

    <!-- Header -->
    <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-accent tracking-wider">LEDGER<span class="text-white">LITE</span></h1>
            <p class="text-sm text-gray-400 mt-1">Track your personal expenses seamlessly</p>
        </div>
        <div class="text-right">
            <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Grand Total</p>
            <p class="text-2xl font-black text-white" id="grandTotal">৳0.00</p>
        </div>
    </header>

    <!-- Create New List Form -->
    <div class="bg-cardBg p-5 rounded-lg shadow-lg border border-gray-700 mb-8 flex gap-3 tilt-card" data-tilt data-tilt-max="2" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.05">
        <input type="text" id="newListTitle" placeholder="e.g., Bazar Today, Shabab's Wishlist..." class="flex-grow p-3 bg-darkBg border border-gray-600 rounded text-white focus:outline-none focus:border-accent transition-colors tilt-card-inner" onkeypress="handleEnter(event, createList)">
        <button onclick="createList()" class="bg-accent hover:bg-accentHover text-white font-bold py-3 px-6 rounded transition-colors duration-200 tilt-card-inner shadow-[0_0_15px_rgba(16,185,129,0.3)]">
            Create Note
        </button>
    </div>

    <!-- Expense Lists Container -->
    <main id="listsContainer" class="flex-grow space-y-6 pb-10">
        <!-- Lists will be injected here by JavaScript -->
    </main>

    <script>
        // --- AUDIO SYNTHESIZER ---
        let audioCtx = null;
        
        // Browsers require a user interaction before playing audio
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type = 'add') {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'add') {
                // High tech pop for adding items
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            } else if (type === 'delete') {
                // Low thud for deleting items
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            }
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        // --- APP LOGIC ---
        let expenseNotes = JSON.parse(localStorage.getItem('ledgerlite_data')) || [];

        function saveAndRender() {
            localStorage.setItem('ledgerlite_data', JSON.stringify(expenseNotes));
            renderUI();
        }

        function createList() {
            initAudio();
            const titleInput = document.getElementById('newListTitle');
            const title = titleInput.value.trim();
            
            if (!title) return;

            const newList = {
                id: Date.now().toString(),
                title: title,
                items: []
            };

            expenseNotes.unshift(newList);
            titleInput.value = '';
            playSound('add');
            saveAndRender();
        }

        function deleteList(id) {
            initAudio();
            if (confirm("Are you sure you want to delete this entire note?")) {
                expenseNotes = expenseNotes.filter(note => note.id !== id);
                playSound('delete');
                saveAndRender();
            }
        }

        function addItem(listId) {
            initAudio();
            const nameInput = document.getElementById(`itemName_${listId}`);
            const amountInput = document.getElementById(`itemAmount_${listId}`);
            
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!name || isNaN(amount) || amount <= 0) {
                alert("Please enter a valid item name and amount.");
                return;
            }

            const listIndex = expenseNotes.findIndex(note => note.id === listId);
            if (listIndex !== -1) {
                expenseNotes[listIndex].items.push({ name, amount });
                playSound('add');
                saveAndRender();
            }
        }

        function deleteItem(listId, itemIndex) {
            initAudio();
            const listIndex = expenseNotes.findIndex(note => note.id === listId);
            if (listIndex !== -1) {
                expenseNotes[listIndex].items.splice(itemIndex, 1);
                playSound('delete');
                saveAndRender();
            }
        }

        function handleEnter(event, callback, param = null) {
            if (event.key === 'Enter') {
                event.preventDefault();
                param ? callback(param) : callback();
            }
        }

        function renderUI() {
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';
            
            let grandTotal = 0;

            if (expenseNotes.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 italic mt-10">No expense notes yet. Create one above to get started.</p>';
                document.getElementById('grandTotal').textContent = '৳0.00';
                return;
            }

            expenseNotes.forEach(note => {
                const noteTotal = note.items.reduce((sum, item) => sum + item.amount, 0);
                grandTotal += noteTotal;

                let itemsHtml = '';
                if (note.items.length === 0) {
                    itemsHtml = '<p class="text-gray-500 text-sm italic py-2 tilt-card-inner">No items added yet.</p>';
                } else {
                    itemsHtml = note.items.map((item, index) => `
                        <div class="flex justify-between items-center border-b border-gray-700/50 py-3 group tilt-card-inner">
                            <span class="text-gray-200">${item.name}</span>
                            <div class="flex items-center gap-4">
                                <span class="text-accent font-mono font-medium">৳${item.amount.toFixed(2)}</span>
                                <button onclick="deleteItem('${note.id}', ${index})" class="text-gray-600 hover:text-red-400 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100" title="Delete item">
                                    ✕
                                </button>
                            </div>
                        </div>
                    `).join('');
                }

                const card = document.createElement('div');
                // Added tilt-card class and data-tilt attributes for the 3D hover effect
                card.className = "bg-cardBg rounded-lg shadow-lg border border-gray-700 overflow-hidden tilt-card";
                card.setAttribute('data-tilt', '');
                card.setAttribute('data-tilt-max', '2');
                card.setAttribute('data-tilt-speed', '400');
                card.setAttribute('data-tilt-glare', 'true');
                card.setAttribute('data-tilt-max-glare', '0.05');
                
                card.innerHTML = `
                    <div class="bg-darkBg/50 p-4 border-b border-gray-700 flex justify-between items-center tilt-card-inner">
                        <h2 class="text-xl font-semibold text-white">${note.title}</h2>
                        <div class="flex items-center gap-4">
                            <span class="text-lg font-bold text-accent bg-accent/10 px-3 py-1 rounded">Total: ৳${noteTotal.toFixed(2)}</span>
                            <button onclick="deleteList('${note.id}')" class="text-gray-500 hover:text-red-500 transition-colors text-sm">Delete Note</button>
                        </div>
                    </div>
                    
                    <div class="p-4 bg-cardBg">
                        ${itemsHtml}
                    </div>

                    <div class="p-4 bg-darkBg/30 border-t border-gray-700 flex gap-2 tilt-card-inner">
                        <input type="text" id="itemName_${note.id}" placeholder="Item (e.g., Chicken)" class="w-1/2 p-2 bg-darkBg border border-gray-600 rounded text-sm text-white focus:outline-none focus:border-accent" onkeypress="handleEnter(event, addItem, '${note.id}')">
                        <input type="number" id="itemAmount_${note.id}" placeholder="Amount (৳)" class="w-1/3 p-2 bg-darkBg border border-gray-600 rounded text-sm text-white focus:outline-none focus:border-accent" onkeypress="handleEnter(event, addItem, '${note.id}')">
                        <button onclick="addItem('${note.id}')" class="w-1/6 bg-gray-700 hover:bg-accent text-white font-bold rounded text-sm transition-colors duration-200">
                            Add
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('grandTotal').textContent = `৳${grandTotal.toFixed(2)}`;

            // Initialize VanillaTilt on the newly created cards
            VanillaTilt.init(document.querySelectorAll(".tilt-card"));
        }

        renderUI();
    </script>
</body>
</html>
